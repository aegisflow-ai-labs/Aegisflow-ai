[project]
name = "aegisflow-ai"
version = "0.1.0"
description = "Evidence-driven operational decision support with a deterministic, auditable baseline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pyjwt[crypto]>=2.10.1,<3",
    "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/aegisflow-ai-labs/Aegisflow-ai"
Issues = "https://github.com/aegisflow-ai-labs/Aegisflow-ai/issues"
Security = "https://github.com/aegisflow-ai-labs/Aegisflow-ai/security/policy"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pip-audit>=2.9,<3",
    "httpx2>=2.16.0",
    "playwright>=1.56,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisflow"]
