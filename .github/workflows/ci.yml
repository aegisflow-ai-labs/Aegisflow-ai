name: baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      AEGISFLOW_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/postgres
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.4
      - run: sh tools/check.sh
      - name: Dependency audit and SBOM
        run: .venv/bin/pip-audit --skip-editable --format cyclonedx-json --output sbom.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sbom-python-${{ matrix.python }}
          path: sbom.json
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --redact --no-banner

  browser-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --no-editable
      - run: .venv/bin/playwright install --with-deps chromium
      - name: Start local identity pilot
        run: |
          mkdir -p work
          .venv/bin/python tools/keycloak_demo.py >work/keycloak-api.log 2>&1 &
          echo $! >work/keycloak-api.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            if ! kill -0 $(cat work/keycloak-api.pid) 2>/dev/null; then
              echo 'Local identity pilot exited before readiness'; exit 1
            fi
            sleep 1
          done
          echo 'Local identity pilot readiness timed out'; exit 1
      - name: Verify real browser login and investigation
        run: .venv/bin/python tools/check_keycloak.py
      - name: Stop local pilot
        if: always()
        run: |
          if test -f work/keycloak-api.pid; then kill -INT $(cat work/keycloak-api.pid) || true; fi
          .venv/bin/python tools/keycloak_demo.py stop
